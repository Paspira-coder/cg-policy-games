<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crack the Code</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: follows Example.pptx — white slide, navy title top-left, scrambled letters set large in the middle. Host controls sit below the puzzle. Deliberately single light theme to match the corporate slide. */
:root{
  --bg:#FFFFFF; --ink:#19226D; --muted:#5B6391; --line:#D6DBEE; --soft:#F3F6FC;
  --cyan:#00A5DB; --go:#00B050; --stop:#FF0000; --gold:#E8A400; --hl:#FFF4C2;
  --display:"Kanit","Leelawadee UI","Tahoma",sans-serif;
  --body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
 
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;display:flex;flex-direction:column}
.app{flex:1;min-height:0;width:100%;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{font-weight:700;font-size:clamp(17px,1.7vw,22px);margin:0}
.title b{font-size:1.12em}
.sub{color:var(--muted);font-size:14px}
button{font-family:var(--body);cursor:pointer;border-radius:8px;font-size:16px;font-weight:600;padding:9px 16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);transition:background .15s,transform .08s}
button:hover{background:var(--soft)}button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-go{background:var(--go);border-color:var(--go);color:#fff}
.btn-go:hover{background:#009A46}
.btn-stop{background:var(--stop);border-color:var(--stop);color:#fff}
.btn-stop:hover{background:#D90000}
.btn-cyan{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-cyan:hover{background:#26318A}
.btn-ghost{background:transparent}
.big{font-size:clamp(17px,1.8vw,22px);padding:12px 24px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.home{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;flex:1;min-height:0;overflow:auto}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.team{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;cursor:pointer}
.team.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,165,219,.25)}
.team .rk{font-family:var(--display);font-weight:700;font-size:26px;color:var(--muted);width:30px;text-align:center}
.team input{font-family:var(--body);font-size:19px;font-weight:700;background:transparent;border:0;color:var(--ink);width:100%;min-width:0;padding:2px 0;border-bottom:1px dashed transparent}
.team input:hover,.team input:focus{border-bottom-color:var(--line);outline:none}
.team .sc{font-family:var(--display);font-weight:700;font-size:32px;color:var(--ink);font-variant-numeric:tabular-nums;grid-row:span 2}
.team .meta{grid-column:2;color:var(--muted);font-size:13px}
.team.done .rk{color:var(--go)}
.side{background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.set{font-size:20px;font-weight:700;padding:10px 0}
.set.used{opacity:.35;text-decoration:line-through}
.set.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.pick{font-size:19px}
.pick b{color:var(--cyan)}
.rules{color:var(--muted);font-size:14px;line-height:1.7;margin:0;padding-left:18px}
kbd{font-family:var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.playbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.who{font-family:var(--display);font-size:clamp(22px,2.4vw,32px);font-weight:700}
.who small{font-size:.58em;color:var(--muted);font-weight:400;margin-left:8px}
.dots{display:flex;gap:8px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dot.cur{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,165,219,.25)}
.dot.ok{background:var(--go);border-color:var(--go)}
.dot.skip{background:var(--gold);border-color:var(--gold)}
.score-now{font-family:var(--display);font-size:clamp(22px,2.4vw,32px);font-weight:700;font-variant-numeric:tabular-nums}
.clock{position:relative;width:clamp(84px,9vw,124px);aspect-ratio:1;max-width:100%}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(30px,3.6vw,50px);font-variant-numeric:tabular-nums}
.clock.warn .n{color:var(--stop);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(10px,2.4vh,28px);padding:12px 16px;position:relative;overflow-y:auto;overflow-x:hidden}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,.8vw,12px);max-width:100%}
.tile{min-width:clamp(44px,6vw,96px);padding:0 4px;display:grid;place-items:center;color:var(--ink);font-family:var(--display);font-weight:500;font-size:calc(var(--k,1) * clamp(38px,min(7vw,12vh),110px));line-height:1.45;border-bottom:4px solid var(--line);animation:drop .35s backwards}
.tiles.small .tile{min-width:clamp(30px,3.8vw,60px);font-size:calc(var(--k,1) * clamp(30px,min(4.6vw,8vh),72px))}
.board.revealed .tile{min-width:clamp(30px,3.6vw,56px);font-size:calc(var(--k,1) * clamp(26px,min(4vw,7vh),60px));border-bottom-width:3px}
@keyframes drop{from{transform:translateY(-18px);opacity:0}}
.hint{max-width:60ch;text-align:center;font-size:calc(var(--k,1) * clamp(16px,min(2vw,3.6vh),28px));line-height:1.5}
.hint .label{display:block;margin-bottom:6px;color:var(--cyan)}
.hint.none{color:var(--muted)}
.answer{font-size:calc(var(--k,1) * clamp(28px,min(4.6vw,9vh),66px));line-height:1.5;color:var(--ink);text-align:center;padding:.1em .6em;background:var(--hl);border-radius:12px}
.answer b{font-weight:700}
.flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;font-family:var(--display);font-weight:700;font-size:clamp(56px,min(9vw,16vh),140px);line-height:1.3;pointer-events:none;opacity:0;text-align:center;padding:16px}
.flash.ans{background:rgba(255,255,255,.94)}
.flash small{display:block;font-size:.62em;color:var(--ink);font-weight:700}
.flash small span{display:block;font-size:.4em;color:var(--muted);font-weight:500;font-family:var(--body)}
.flash.show{animation:flash var(--dur,.7s) forwards}
@keyframes flash{0%{opacity:0;transform:scale(.85)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(255,255,255,.95);text-align:center;padding:20px}
.overlay h2{font-size:clamp(26px,3.6vw,50px);margin:0}
.count{font-family:var(--display);font-weight:700;font-size:clamp(90px,15vw,200px);color:var(--cyan)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.kbd{color:var(--muted);font-size:12px;text-align:center}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.rcard{border:1.5px solid var(--line);border-top:6px solid var(--stop);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard.ok{border-top-color:var(--go)}
.rcard .w{font-weight:700;font-size:clamp(20px,2vw,28px);overflow-wrap:anywhere}
.rcard .st{font-size:13px;font-weight:700}
.rcard.ok .st{color:var(--go)}.rcard:not(.ok) .st{color:var(--stop)}
.rcard .h{color:var(--muted);font-size:13px;line-height:1.5}
.bigscore{font-family:var(--display);font-weight:700;font-size:clamp(46px,6.6vw,90px);line-height:1}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.rounds button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 18px;font-size:18px}
.rounds button small{font-size:13px;font-weight:500;color:var(--muted)}
.rounds button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rounds button.on small{color:#C9D0F0}
.winner{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.6vw,34px);background:var(--hl);border-radius:12px;padding:10px 18px}
.winner small{font-family:var(--body);font-size:.55em;font-weight:500;color:var(--muted);margin-left:8px}
.team.out{opacity:.45;cursor:default}
.team .fin{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;margin-top:4px}
.team .fin input{width:18px;height:18px;accent-color:var(--ink)}
.wheel-modal{position:fixed;inset:0;z-index:50;background:rgba(25,34,109,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wheel-card{background:var(--bg);border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.wheel-card h2{margin:0;font-size:clamp(20px,2.2vw,28px)}
.wheel-card .sub{margin-top:-6px}
.wheel-wrap{position:relative;width:min(62vh,86vw,560px);aspect-ratio:1;max-width:100%}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--stop);filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.wheel-hub{position:absolute;left:50%;top:50%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);border:4px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:clamp(12px,1.4vw,18px)}
.wheel-res{min-height:1.6em;font-weight:700;font-size:clamp(22px,2.8vw,36px);text-align:center;max-width:30ch;text-wrap:balance}
.wheel-res small{display:block;font-size:.45em;color:var(--muted);font-weight:600;letter-spacing:1px}
.confirm{border:1.5px solid var(--stop);border-radius:10px;padding:8px 12px;background:var(--bg)}
@media (max-width:900px){.home{grid-template-columns:1fr}.res{grid-template-columns:repeat(2,minmax(0,1fr))}.teams{grid-template-columns:1fr}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

  S.round=n; S.selSet=null;
  if(n===2) autoFinalists();
  const first=S.teams.findIndex((t,i)=>eligible(i)&&!res(t)); S.selTeam = first>=0?first:Math.max(0,S.teams.findIndex((t,i)=>eligible(i)));
  save(); renderHome();
}
function renderHome(){
  $('#btnHome').hidden=true; pg('');
  const k=RN(), sec=TIMES[S.round];
  const rk = ranking(); const rankOf = {}; rk.forEach((o,n)=>rankOf[o.i]=n+1);
  if(!eligible(S.selTeam)){ const f=S.teams.findIndex((t,i)=>eligible(i)); S.selTeam=f>=0?f:0; }
  const t = S.teams[S.selTeam];
  const fins = S.teams.map((t,i)=>i).filter(eligible);
  const allDone = S.round===2 && fins.length>0 && fins.every(i=>S.teams[i].r[1]);
  let winner='';
  if(allDone && rk.length){
    const top=rk[0], tie=rk.filter(o=>o.x.score===top.x.score && o.x.time===top.x.time);
    winner = tie.length>1 ? `<div class="winner">เสมอ: ${tie.map(o=>esc(o.t.name)).join(' · ')} <small>${top.x.score} คำ · ${top.x.time} วิ</small></div>`
                          : `<div class="winner">🏆 ผู้ชนะ: ${esc(top.t.name)} <small>${top.x.score} คำ · ${top.x.time} วิ</small></div>`;
  }
  main.innerHTML = `
  <div class="screen">
    <div class="rounds" role="tablist">
      <button type="button" role="tab" class="${S.round===1?'on':''}" data-r="1">รอบที่ 1 <small>60 วินาที · ทุกทีม</small></button>
      <button type="button" role="tab" class="${S.round===2?'on':''}" data-r="2">รอบชิงชนะเลิศ <small>30 วินาที · ทีมที่เข้ารอบ</small></button>
    </div>
    ${winner}
    <div class="home">
    <section>
      <div class="label" style="margin-bottom:8px">${S.round===1?'ตารางคะแนนรอบที่ 1 · คลิกการ์ดเพื่อเลือกทีม · คลิกชื่อเพื่อแก้ไข':'ตารางคะแนนรอบชิง · ติ๊ก “เข้ารอบชิง” เพื่อเลือกทีมที่เข้ารอบ'}</div>
      <div class="teams">${S.teams.map((tm,i)=>{ const x=tm.r[k], r1=tm.r[0], el=eligible(i); return `
        <div class="team ${i===S.selTeam&&el?'sel':''} ${x?'done':''} ${el?'':'out'}" data-i="${i}" role="button" tabindex="0">
          <div class="rk">${rankOf[i]||'–'}</div>
          <input id="tn${i}" value="${esc(tm.name)}" aria-label="ชื่อทีม ${i+1}">
          <div class="sc">${x?x.score:'–'}</div>
          <div class="meta">${x?`ชุดที่ ${x.set} · ใช้เวลา ${x.time} วิ`:(el?'ยังไม่ได้เล่น':'ไม่ได้เข้ารอบ')}${S.round===2?` · รอบ 1: ${r1?r1.score+' คำ':'–'}`:''}</div>
          ${S.round===2?`<label class="fin"><input type="checkbox" id="fin${i}" data-f="${i}" ${tm.fin?'checked':''}> เข้ารอบชิง</label>`:''}
        </div>`}).join('')}
      </div>
      <p class="kbd" style="text-align:left;margin-top:10px">อันดับเรียงตามจำนวนคำที่ถูก ถ้าเท่ากันทีมที่ใช้เวลาน้อยกว่าชนะ${S.round===2?' · รอบชิงนับเฉพาะคะแนนรอบชิง':''}</p>
    </section>
    <aside class="side">
      <div class="pick">${S.round===1?'รอบที่ 1':'รอบชิง'} · ทีมที่จะเล่น: <b>${fins.length?esc(t.name):'ยังไม่ได้เลือกทีมเข้ารอบ'}</b></div>
      <button type="button" class="btn-cyan big" id="openWheel">🎡 หมุนวงล้อสุ่มทีม</button>
      <div>
        <div class="label" style="margin-bottom:8px">เลือกชุดคำ (ขีดฆ่า = ใช้แล้ว)</div>
        <div class="sets">${SETS.map((_,n)=>`<button type="button" class="set ${S.used.includes(n+1)?'used':''} ${S.selSet===n+1?'sel':''}" data-s="${n+1}">${n+1}</button>`).join('')}</div>
      </div>
      <div class="row">
        <button type="button" id="rand">🎲 สุ่มชุด</button>
        <span class="spacer"></span>
        <button type="button" id="start" class="btn-go big" ${S.selSet&&fins.length?'':'disabled'}>เริ่ม ${sec} วินาที ▶</button>
      </div>
      <ol class="rules">
        <li>รอบที่ 1: ทุกทีม ทีมละ 60 วินาที · รอบชิง: ทีมที่เข้ารอบ ทีมละ 30 วินาที</li>
        <li>พิธีกรกด “เริ่ม” จะนับถอยหลัง 3-2-1 แล้วจับเวลา</li>
        <li>ตอบถูกกด <kbd>Enter</kbd> หรือ ✓ · ติดคำไหนกด <kbd>S</kbd> ข้าม</li>
        <li><kbd>Space</kbd> หยุด/เล่นต่อ · <kbd>A</kbd> เปิดเฉลยบนจอ</li>
      </ol>
      <div class="spacer"></div>
      <div class="row" id="resetRow">
        ${resetArmed?`<div class="confirm row"><span>ล้างคะแนนทั้ง 2 รอบ?</span><button type="button" class="btn-stop" id="resetYes">ล้างเลย</button><button type="button" id="resetNo">ยกเลิก</button></div>`
        :`<button type="button" class="btn-ghost" id="reset">↺ เริ่มการแข่งขันใหม่</button>`}
      </div>
    </aside>
  </div></div>`;
  main.querySelectorAll('.rounds button').forEach(b=>b.onclick=()=>setRound(+b.dataset.r));
  main.querySelectorAll('.team').forEach(el=>{
    const i=+el.dataset.i;
    el.addEventListener('click',e=>{ if(e.target.tagName==='INPUT'||e.target.closest('label')||!eligible(i)) return; S.selTeam=i; save(); renderHome(); });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target===el&&eligible(i)){ S.selTeam=i; save(); renderHome(); }});
  });
  main.querySelectorAll('.team input[id^="tn"]').forEach(inp=>{
    const i=+inp.id.slice(2);
    inp.addEventListener('input',()=>{ S.teams[i].name=inp.value||('ทีม '+(i+1)); save(); if(S.selTeam===i) $('.pick b').textContent=S.teams[i].name; });
  });
  main.querySelectorAll('input[data-f]').forEach(cb=>cb.onchange=()=>{ const i=+cb.dataset.f; S.teams[i].fin=cb.checked; if(cb.checked) S.selTeam=i; save(); renderHome(); });
  main.querySelectorAll('.set').forEach(b=>b.onclick=()=>{ S.selSet=+b.dataset.s; save(); renderHome(); });
  $('#rand').onclick=()=>{ const free=SETS.map((_,n)=>n+1).filter(n=>!S.used.includes(n)); if(!free.length) return; S.selSet=free[Math.floor(Math.random()*free.length)]; save(); renderHome(); };
  $('#start').onclick=()=>startRound();
  $('#openWheel').onclick=openWheel;
  if($('#reset')) $('#reset').onclick=()=>{resetArmed=true;renderHome();};
  if($('#resetNo')) $('#resetNo').onclick=()=>{resetArmed=false;renderHome();};
  if($('#resetYes')) $('#resetYes').onclick=()=>{const snd=S.sound; S=fresh(); S.sound=snd; resetArmed=false; save(); renderHome();};
}

/* ---------- WHEEL ---------- */
const WCOL=['#19226D','#00A5DB','#00B050','#E8A400','#3A4AB8','#0B7FB0'];
let W={pool:[],rot:0,spinning:false,pick:null};
function wheelPool(){
  const k=RN();
  let p=S.teams.map((t,i)=>i).filter(i=>eligible(i)&&!S.teams[i].r[k]);
  return p;
}
function openWheel(){
  W.pool=wheelPool(); W.pick=null;
  $('#wmSub').textContent = W.pool.length ? `${S.round===1?'รอบที่ 1':'รอบชิง'} · สุ่มจากทีมที่ยังไม่ได้เล่น ${W.pool.length} ทีม` : 'ทุกทีมในรอบนี้เล่นครบแล้ว';
  $('#wmRes').innerHTML=''; $('#wmUse').hidden=true; $('#wmSpin').disabled=W.pool.length<1;
  $('#wm').hidden=false; drawWheel(); $('#wmSpin').focus();
}
function closeWheel(){ if(W.spinning) return; $('#wm').hidden=true; }
function drawWheel(){
  const c=$('#wheel'), ctx=c.getContext('2d');
  const box=c.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
  const size=Math.max(200,Math.round((box.width||560)*dpr));
  if(c.width!==size){ c.width=size; c.height=size; }
  const n=Math.max(1,W.pool.length), cx=size/2, R=size/2-6*dpr, a=2*Math.PI/n;
  ctx.clearRect(0,0,size,size);
  ctx.beginPath(); ctx.arc(cx,cx,R+4*dpr,0,2*Math.PI); ctx.fillStyle='#19226D'; ctx.fill();
  if(!W.pool.length){ ctx.beginPath(); ctx.arc(cx,cx,R,0,2*Math.PI); ctx.fillStyle='#D6DBEE'; ctx.fill(); return; }
  W.pool.forEach((ti,i)=>{
    const s=-Math.PI/2+W.rot+i*a;
    ctx.beginPath(); ctx.moveTo(cx,cx); ctx.arc(cx,cx,R,s,s+a); ctx.closePath();
    ctx.fillStyle=WCOL[i%WCOL.length]; ctx.fill();
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=2*dpr; ctx.stroke();
    ctx.save(); ctx.translate(cx,cx); ctx.rotate(s+a/2);
    const name=S.teams[ti].name, maxW=R*0.70, inner=R*0.2;
    const maxH = n===1 ? R*0.2 : Math.min(R*0.14, 2*R*0.55*Math.sin(a/2)*0.75);
    let fs=maxH; ctx.font=`700 ${fs}px "IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif`;
    // try one line, then two lines
    const words=name.split(/\s+/); let lines=[name];
    while(ctx.measureText(name).width>maxW && fs>13*dpr){ fs-=1*dpr; ctx.font=`700 ${fs}px "IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif`; }
    if(ctx.measureText(name).width>maxW && words.length>1){
      fs=maxH*0.62; const half=Math.ceil(words.length/2); lines=[words.slice(0,half).join(' '),words.slice(half).join(' ')];
      ctx.font=`700 ${fs}px "IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif`;
      while(Math.max(...lines.map(l=>ctx.measureText(l).width))>maxW && fs>11*dpr){ fs-=1*dpr; ctx.font=`700 ${fs}px "IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif`; }
    }
    ctx.fillStyle = WCOL[i%WCOL.length]==='#E8A400' ? '#19226D' : '#FFFFFF';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    const lh=fs*1.15, x=R*0.92, y0=-(lines.length-1)*lh/2;
    lines.forEach((l,k)=>{ let t=l; while(ctx.measureText(t).width>maxW && t.length>2) t=t.slice(0,-2)+'…'; ctx.fillText(t,x,y0+k*lh); });
    ctx.restore();
  });
}
function spinWheel(){
  if(W.spinning||!W.pool.length) return;
  const n=W.pool.length, a=2*Math.PI/n, j=Math.floor(Math.random()*n);
  const jitter=(Math.random()-.5)*a*0.6;
  const target=-(j+0.5)*a+jitter;
  const base=W.rot%(2*Math.PI);
  let delta=((target-base)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const total=delta+2*Math.PI*(5+Math.floor(Math.random()*2));
  const start=W.rot, dur=4800, t0=performance.now(); let lastSeg=null;
  W.spinning=true; $('#wmSpin').disabled=true; $('#wmUse').hidden=true; $('#wmRes').innerHTML=''; $('#wmClose').disabled=true;
  const ease=t=>1-Math.pow(1-t,3);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now){
    const t=reduce?1:Math.min(1,(now-t0)/dur);
    W.rot=start+total*ease(t); drawWheel();
    const seg=Math.floor((((-W.rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI))/a);
    if(seg!==lastSeg){ if(lastSeg!==null) beep(1500,.02,'square',.06); lastSeg=seg; }
    if(t<1) requestAnimationFrame(frame); else done();
  }
  function done(){
    W.spinning=false; W.rot=W.rot%(2*Math.PI); W.pick=W.pool[j];
    sfx.ok(); $('#wmRes').innerHTML=`<small>ทีมที่ได้</small>${esc(S.teams[W.pick].name)}`;
    $('#wmUse').hidden=false; $('#wmSpin').disabled=false; $('#wmSpin').textContent='หมุนอีกครั้ง'; $('#wmClose').disabled=false; $('#wmUse').focus();
  }
  requestAnimationFrame(frame);
}
$('#wmSpin').onclick=spinWheel;
$('#wmClose').onclick=closeWheel;
$('#wmUse').onclick=()=>{ if(W.pick===null) return; S.selTeam=W.pick; save(); $('#wm').hidden=true; renderHome(); };
$('#wm').addEventListener('click',e=>{ if(e.target.id==='wm') closeWheel(); });
document.addEventListener('keydown',e=>{ if($('#wm').hidden) return; if(e.key==='Escape') closeWheel(); else if(e.key===' '&&e.target.tagName!=='BUTTON'){ e.preventDefault(); spinWheel(); } });
window.addEventListener('resize',()=>{ if(!$('#wm').hidden) drawWheel(); });

/* ---------- PLAY ---------- */
let R=null, timer=null;
function startRound(){
  const words = SETS[S.selSet-1].map((w,k)=>({...w,k,st:null}));
  R={team:S.selTeam,round:S.round,time:TIMES[S.round],set:S.selSet,words,queue:words.map(w=>w.k),left:TIMES[S.round],running:false,phase:'count',reveal:false};
  $('#btnHome').hidden=false;
  renderPlay(); countdown();
}
function countdown(){
  let n=3; R.phase='count'; paintOverlay(n); beep(600,.15);
  clearInterval(window._cd);
  const iv=window._cd=setInterval(()=>{ if(!R||R.phase!=='count'){clearInterval(iv);return;} n--; if(n>0){ paintOverlay(n); beep(600,.15);} else { clearInterval(iv); R.phase='play'; sfx.go(); resume(); renderPlay(); } },900);
}
function paintOverlay(n){ const o=$('#ov'); if(o) o.innerHTML=`<h2>${R.round===2?'รอบชิง · ':'รอบที่ 1 · '}${esc(S.teams[R.team].name)} · ชุดที่ ${R.set}</h2><div class="count">${n}</div>`; }
function resume(){ R.running=true; clearInterval(timer); timer=setInterval(tick,1000); paintClock(); }
function pause(){ R.running=false; clearInterval(timer); }
function tick(){
  R.left--; if(R.left<=10&&R.left>0) sfx.tick();
  paintClock();
  if(R.left<=0){ finish(); }
}
function cur(){ return R.words[R.queue[0]]; }
function renderPlay(){
  pg(R.set);
  const w = cur();
  const correct = R.words.filter(x=>x.st==='ok').length;
  main.innerHTML=`
  <div class="screen">
    <div class="playbar">
      <div class="who">${esc(S.teams[R.team].name)}<small>${R.round===2?'รอบชิง':'รอบที่ 1'} · ชุดที่ ${R.set}</small></div>
      <div class="dots" aria-label="ความคืบหน้า">${R.words.map(x=>`<span class="dot ${x.st==='ok'?'ok':x.st==='skip'?'skip':''} ${w&&x.k===w.k?'cur':''}"></span>`).join('')}</div>
      <span class="spacer"></span>
      <div><div class="label">ถูก</div><div class="score-now">${correct}/5</div></div>
      <div class="clock" id="clock"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#E3E7F4" stroke-width="8"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="#00A5DB" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg><div class="n" id="clockN">${R.left}</div></div>
    </div>
    <div class="board ${R.reveal?'revealed':''}">
      ${w?`
      <div class="tiles ${w.t.length>10?'small':''}">${w.t.map((c,i)=>`<div class="tile" style="animation-delay:${i*40}ms">${esc(c)}</div>`).join('')}</div>
      ${R.reveal?`<div class="answer">เฉลย → <b>${esc(w.a)}</b></div>`:''}`:''}
      <div class="flash" id="flash"></div>
      ${R.phase==='count'?`<div class="overlay" id="ov"></div>`:''}
      ${R.phase==='play'&&!R.running&&!R.ending?`<div class="overlay"><h2>หยุดเวลาชั่วคราว</h2><button type="button" class="btn-cyan big" id="resumeBtn">เล่นต่อ ▶</button></div>`:''}
    </div>
    <div class="controls">
      <button type="button" class="btn-go big" id="okBtn">✓ ตอบถูก</button>
      <button type="button" class="big" id="skipBtn">ข้าม ↻</button>
      <button type="button" class="big btn-ghost" id="ansBtn">${R.reveal?'ซ่อนเฉลย':'เปิดเฉลย'}</button>
      <button type="button" class="big btn-ghost" id="pauseBtn">${R.running?'❚❚ หยุด':'▶ เล่นต่อ'}</button>
      <button type="button" class="big btn-stop" id="endBtn">จบรอบ</button>
    </div>
    <div class="kbd"><kbd>Enter</kbd> ถูก · <kbd>S</kbd> ข้าม · <kbd>A</kbd> เฉลย · <kbd>Space</kbd> หยุด/เล่นต่อ</div>
  </div>`;
  if(R.phase==='count') paintOverlay(3);
  paintClock(); fitBox($('.board'));
  const busy = R.phase!=='play';
  ['okBtn','skipBtn','ansBtn','pauseBtn'].forEach(id=>$('#'+id).disabled=busy);
  $('#okBtn').onclick=mark;
  $('#skipBtn').onclick=skip;
  $('#ansBtn').onclick=()=>{R.reveal=!R.reveal;renderPlay();};
  $('#pauseBtn').onclick=togglePause;
  $('#endBtn').onclick=finish;
  if($('#resumeBtn')) $('#resumeBtn').onclick=togglePause;
}
function paintClock(){
  const n=$('#clockN'),a=$('#arc'),c=$('#clock'); if(!n) return;
  n.textContent=Math.max(0,R.left);
  a.style.strokeDashoffset = 276.46*(1-Math.max(0,R.left)/R.time);
  a.style.stroke = R.left<=10?'#FF0000':'#00A5DB';
  c.classList.toggle('warn',R.left<=10&&R.running);
}
function togglePause(){ if(R.phase!=='play') return; R.running?pause():resume(); renderPlay(); }
function flash(txt,col,ans,dur){ const f=$('#flash'); if(!f) return; f.innerHTML=esc(txt)+(ans?`<small><span>เฉลย</span>${esc(ans)}</small>`:''); f.style.color=col; f.classList.toggle('ans',!!ans); f.style.setProperty('--dur',(dur||700)+'ms'); f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); }
function mark(){
  if(R.phase!=='play'||!R.running) return;
  const w=cur(); w.st='ok'; R.queue.shift(); R.reveal=false; sfx.ok();
  if(!R.queue.length){ pause(); R.ending=true; renderPlay(); flash('ถูกต้อง!','#00B050',w.a,1800); setTimeout(()=>{ if(R&&R.phase==='play') finish(); },1700); return; }
  renderPlay(); flash('ถูกต้อง!','#00B050',w.a,1600);
}
function skip(){
  if(R.phase!=='play'||!R.running) return;
  if(R.queue.length<2){ sfx.skip(); return; }
  const w=cur(); w.st='skip'; R.queue.push(R.queue.shift()); R.reveal=false; sfx.skip();
  renderPlay(); flash('ข้าม','#E8A400');
}
function finish(){
  if(!R||R.phase==='done') return;
  pause(); R.phase='done'; sfx.end();
  const score=R.words.filter(w=>w.st==='ok').length;
  const used=R.time-Math.max(0,R.left);
  const t=S.teams[R.team]; t.r[R.round-1]={score,time:used,set:R.set};
  if(!S.used.includes(R.set)) S.used.push(R.set);
  // next unplayed team in this round becomes selected
  const nxt=S.teams.findIndex((x,i)=>eligible(i)&&!x.r[R.round-1]); if(nxt>=0) S.selTeam=nxt; S.selSet=null;
  save(); renderResult(score,used);
}
function renderResult(score,used){
  const t=S.teams[R.team];
  main.innerHTML=`
  <div class="screen">
    <div class="playbar">
      <div class="who">${esc(t.name)}<small>${R.round===2?'รอบชิง':'รอบที่ 1'} · ชุดที่ ${R.set} · ใช้เวลา ${used} วินาที</small></div>
      <span class="spacer"></span>
      <div style="text-align:right"><div class="label">คะแนนรอบนี้</div><div class="bigscore">${score}<span style="font-size:.45em;color:var(--muted)"> / 5</span></div></div>
    </div>
    <div class="label">เฉลยทั้งชุด</div>
    <div class="res">${R.words.map(w=>`
      <div class="rcard ${w.st==='ok'?'ok':''}">
        <div class="st">${w.st==='ok'?'✓ ตอบถูก':'✗ ยังไม่ได้'}</div>
        <div class="w">${esc(w.a)}</div>
      </div>`).join('')}</div>
    <div class="spacer"></div>
    <div class="controls"><button type="button" class="btn-cyan big" id="back">ไปตารางคะแนน →</button></div>
  </div>`;
  $('#back').onclick=goHome;
}
function goHome(){
  if(R && R.phase!=='done'){ // abandon mid-round without scoring
    pause(); R=null;
  }
  R=null; renderHome();
}
$('#btnHome').onclick=goHome;

document.addEventListener('keydown',e=>{
  if(!R||R.phase!=='play'||e.target.tagName==='INPUT') return;
  if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();mark();}
  else if(e.key==='s'||e.key==='S'||e.key==='ห'){e.preventDefault();skip();}
  else if(e.key==='a'||e.key==='A'||e.key==='ฟ'){e.preventDefault();R.reveal=!R.reveal;renderPlay();}
  else if(e.key===' '){e.preventDefault();togglePause();}
});

window.addEventListener('resize',()=>fitBox($('.board')));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fitBox($('.board')));
renderHome();
</script>

</body></html>
