<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crack the Code</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: follows Example.pptx — white slide, navy title top-left, scrambled letters set large in the middle. Host controls sit below the puzzle. Deliberately single light theme to match the corporate slide. */
:root{
  --bg:#FFFFFF; --ink:#19226D; --muted:#5B6391; --line:#D6DBEE; --soft:#F3F6FC;
  --cyan:#00A5DB; --go:#00B050; --stop:#FF0000; --gold:#E8A400; --hl:#FFF4C2;
  --display:"Kanit","Leelawadee UI","Tahoma",sans-serif;
  --body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
 
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;display:flex;flex-direction:column}
.app{flex:1;min-height:0;width:100%;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{font-weight:700;font-size:clamp(17px,1.7vw,22px);margin:0}
.title b{font-size:1.12em}
.sub{color:var(--muted);font-size:14px}
button{font-family:var(--body);cursor:pointer;border-radius:8px;font-size:16px;font-weight:600;padding:9px 16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);transition:background .15s,transform .08s}
button:hover{background:var(--soft)}button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.btn-go{background:var(--go);border-color:var(--go);color:#fff}
.btn-go:hover{background:#009A46}
.btn-stop{background:var(--stop);border-color:var(--stop);color:#fff}
.btn-stop:hover{background:#D90000}
.btn-cyan{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-cyan:hover{background:#26318A}
.btn-ghost{background:transparent}
.big{font-size:clamp(17px,1.8vw,22px);padding:12px 24px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.home{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;flex:1;min-height:0}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.team{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;cursor:pointer}
.team.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,165,219,.25)}
.team .rk{font-family:var(--display);font-weight:700;font-size:26px;color:var(--muted);width:30px;text-align:center}
.team input{font-family:var(--body);font-size:19px;font-weight:700;background:transparent;border:0;color:var(--ink);width:100%;min-width:0;padding:2px 0;border-bottom:1px dashed transparent}
.team input:hover,.team input:focus{border-bottom-color:var(--line);outline:none}
.team .sc{font-family:var(--display);font-weight:700;font-size:32px;color:var(--ink);font-variant-numeric:tabular-nums;grid-row:span 2}
.team .meta{grid-column:2;color:var(--muted);font-size:13px}
.team.done .rk{color:var(--go)}
.side{background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.set{font-size:20px;font-weight:700;padding:10px 0}
.set.used{opacity:.35;text-decoration:line-through}
.set.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.pick{font-size:19px}
.pick b{color:var(--cyan)}
.rules{color:var(--muted);font-size:14px;line-height:1.7;margin:0;padding-left:18px}
kbd{font-family:var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.playbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.who{font-family:var(--display);font-size:clamp(22px,2.4vw,32px);font-weight:700}
.who small{font-size:.58em;color:var(--muted);font-weight:400;margin-left:8px}
.dots{display:flex;gap:8px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dot.cur{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,165,219,.25)}
.dot.ok{background:var(--go);border-color:var(--go)}
.dot.skip{background:var(--gold);border-color:var(--gold)}
.score-now{font-family:var(--display);font-size:clamp(22px,2.4vw,32px);font-weight:700;font-variant-numeric:tabular-nums}
.clock{position:relative;width:clamp(84px,9vw,124px);aspect-ratio:1;max-width:100%}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(30px,3.6vw,50px);font-variant-numeric:tabular-nums}
.clock.warn .n{color:var(--stop);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(10px,2.4vh,28px);padding:12px 16px;position:relative;overflow-y:auto;overflow-x:hidden}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,.8vw,12px);max-width:100%}
.tile{min-width:clamp(44px,6vw,96px);padding:0 4px;display:grid;place-items:center;color:var(--ink);font-family:var(--display);font-weight:500;font-size:calc(var(--k,1) * clamp(38px,min(7vw,12vh),110px));line-height:1.45;border-bottom:4px solid var(--line);animation:drop .35s backwards}
.tiles.small .tile{min-width:clamp(30px,3.8vw,60px);font-size:calc(var(--k,1) * clamp(30px,min(4.6vw,8vh),72px))}
.board.revealed .tile{min-width:clamp(30px,3.6vw,56px);font-size:calc(var(--k,1) * clamp(26px,min(4vw,7vh),60px));border-bottom-width:3px}
@keyframes drop{from{transform:translateY(-18px);opacity:0}}
.hint{max-width:60ch;text-align:center;font-size:calc(var(--k,1) * clamp(16px,min(2vw,3.6vh),28px));line-height:1.5}
.hint .label{display:block;margin-bottom:6px;color:var(--cyan)}
.hint.none{color:var(--muted)}
.answer{font-size:calc(var(--k,1) * clamp(28px,min(4.6vw,9vh),66px));line-height:1.5;color:var(--ink);text-align:center;padding:.1em .6em;background:var(--hl);border-radius:12px}
.answer b{font-weight:700}
.flash{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(60px,10vw,150px);pointer-events:none;opacity:0}
.flash.show{animation:flash .7s}
@keyframes flash{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(255,255,255,.95);text-align:center;padding:20px}
.overlay h2{font-size:clamp(26px,3.6vw,50px);margin:0}
.count{font-family:var(--display);font-weight:700;font-size:clamp(90px,15vw,200px);color:var(--cyan)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.kbd{color:var(--muted);font-size:12px;text-align:center}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.rcard{border:1.5px solid var(--line);border-top:6px solid var(--stop);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard.ok{border-top-color:var(--go)}
.rcard .w{font-weight:700;font-size:clamp(20px,2vw,28px);overflow-wrap:anywhere}
.rcard .st{font-size:13px;font-weight:700}
.rcard.ok .st{color:var(--go)}.rcard:not(.ok) .st{color:var(--stop)}
.rcard .h{color:var(--muted);font-size:13px;line-height:1.5}
.bigscore{font-family:var(--display);font-weight:700;font-size:clamp(46px,6.6vw,90px);line-height:1}
.confirm{border:1.5px solid var(--stop);border-radius:10px;padding:8px 12px;background:var(--bg)}
@media (max-width:900px){.home{grid-template-columns:1fr}.res{grid-template-columns:repeat(2,minmax(0,1fr))}.teams{grid-template-columns:1fr}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

          <div class="rk">${rankOf[i]||'–'}</div>
          <input id="tn${i}" value="${esc(tm.name)}" aria-label="ชื่อทีม ${i+1}">
          <div class="sc">${tm.score===null?'–':tm.score}</div>
          <div class="meta">${tm.score===null?'ยังไม่ได้เล่น':`ชุดที่ ${tm.set} · ใช้เวลา ${tm.time} วิ`}</div>
        </div>`).join('')}
      </div>
      <p class="kbd" style="text-align:left;margin-top:10px">อันดับเรียงตามจำนวนคำที่ถูก ถ้าเท่ากันทีมที่ใช้เวลาน้อยกว่าชนะ</p>
    </section>
    <aside class="side">
      <div class="pick">ทีมที่จะเล่น: <b>${esc(t.name)}</b></div>
      <div>
        <div class="label" style="margin-bottom:8px">เลือกชุดคำ (ขีดฆ่า = ใช้แล้ว)</div>
        <div class="sets">${SETS.map((_,k)=>`<button type="button" class="set ${S.used.includes(k+1)?'used':''} ${S.selSet===k+1?'sel':''}" data-s="${k+1}">${k+1}</button>`).join('')}</div>
      </div>
      <div class="row">
        <button type="button" id="rand">🎲 สุ่มชุด</button>
        <span class="spacer"></span>
        <button type="button" id="start" class="btn-go big" ${S.selSet?'':'disabled'}>เริ่มเกม ▶</button>
      </div>
      <ol class="rules">
        <li>พิธีกรกด “เริ่มเกม” จะนับถอยหลัง 3-2-1 แล้วจับเวลา 60 วินาที</li>
        <li>ทีมเรียงตัวอักษรให้เป็นคำ ตอบถูกกด <kbd>Enter</kbd> หรือ ✓</li>
        <li>ติดคำไหนกด <kbd>S</kbd> ข้าม คำนั้นจะวนกลับมาท้ายคิว</li>
        <li><kbd>Space</kbd> หยุด/เล่นต่อ · <kbd>A</kbd> เปิดเฉลยบนจอ</li>
        <li>คำหมวดทั่วไป (เช่น อาหาร วัตถุดิบ) ไม่มีคำใบ้</li>
      </ol>
      <div class="spacer"></div>
      <div class="row" id="resetRow">
        ${resetArmed?`<div class="confirm row"><span>ล้างคะแนนทุกทีม?</span><button type="button" class="btn-stop" id="resetYes">ล้างเลย</button><button type="button" id="resetNo">ยกเลิก</button></div>`
        :`<button type="button" class="btn-ghost" id="reset">↺ เริ่มการแข่งขันใหม่</button>`}
      </div>
    </aside>
  </div></div>`;
  main.querySelectorAll('.team').forEach(el=>{
    el.addEventListener('click',e=>{ if(e.target.tagName==='INPUT') return; S.selTeam=+el.dataset.i; save(); renderHome(); });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target===el){ S.selTeam=+el.dataset.i; save(); renderHome(); }});
  });
  main.querySelectorAll('.team input').forEach((inp,i)=>{
    inp.addEventListener('focus',()=>{ if(S.selTeam!==i){ S.selTeam=i; save(); main.querySelectorAll('.team').forEach((c,k)=>c.classList.toggle('sel',k===i)); $('.pick b').textContent=S.teams[i].name; } });
    inp.addEventListener('input',()=>{ S.teams[i].name=inp.value||('ทีม '+(i+1)); save(); if(S.selTeam===i) $('.pick b').textContent=S.teams[i].name; });
  });
  main.querySelectorAll('.set').forEach(b=>b.onclick=()=>{ S.selSet=+b.dataset.s; save(); renderHome(); });
  $('#rand').onclick=()=>{ const free=SETS.map((_,k)=>k+1).filter(k=>!S.used.includes(k)); if(!free.length) return; S.selSet=free[Math.floor(Math.random()*free.length)]; save(); renderHome(); };
  $('#start').onclick=()=>startRound();
  if($('#reset')) $('#reset').onclick=()=>{resetArmed=true;renderHome();};
  if($('#resetNo')) $('#resetNo').onclick=()=>{resetArmed=false;renderHome();};
  if($('#resetYes')) $('#resetYes').onclick=()=>{const snd=S.sound; S=fresh(); S.sound=snd; resetArmed=false; save(); renderHome();};
}

/* ---------- PLAY ---------- */
let R=null, timer=null;
function startRound(){
  const words = SETS[S.selSet-1].map((w,k)=>({...w,k,st:null}));
  R={team:S.selTeam,set:S.selSet,words,queue:words.map(w=>w.k),left:TIME,running:false,phase:'count',reveal:false};
  $('#btnHome').hidden=false;
  renderPlay(); countdown();
}
function countdown(){
  let n=3; R.phase='count'; paintOverlay(n); beep(600,.15);
  clearInterval(window._cd);
  const iv=window._cd=setInterval(()=>{ if(!R||R.phase!=='count'){clearInterval(iv);return;} n--; if(n>0){ paintOverlay(n); beep(600,.15);} else { clearInterval(iv); R.phase='play'; sfx.go(); resume(); renderPlay(); } },900);
}
function paintOverlay(n){ const o=$('#ov'); if(o) o.innerHTML=`<h2>${esc(S.teams[R.team].name)} · ชุดที่ ${R.set}</h2><div class="count">${n}</div>`; }
function resume(){ R.running=true; clearInterval(timer); timer=setInterval(tick,1000); paintClock(); }
function pause(){ R.running=false; clearInterval(timer); }
function tick(){
  R.left--; if(R.left<=10&&R.left>0) sfx.tick();
  paintClock();
  if(R.left<=0){ finish(); }
}
function cur(){ return R.words[R.queue[0]]; }
function renderPlay(){
  pg(R.set);
  const w = cur();
  const correct = R.words.filter(x=>x.st==='ok').length;
  main.innerHTML=`
  <div class="screen">
    <div class="playbar">
      <div class="who">${esc(S.teams[R.team].name)}<small>ชุดที่ ${R.set}</small></div>
      <div class="dots" aria-label="ความคืบหน้า">${R.words.map(x=>`<span class="dot ${x.st==='ok'?'ok':x.st==='skip'?'skip':''} ${w&&x.k===w.k?'cur':''}"></span>`).join('')}</div>
      <span class="spacer"></span>
      <div><div class="label">ถูก</div><div class="score-now">${correct}/5</div></div>
      <div class="clock" id="clock"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#E3E7F4" stroke-width="8"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="#00A5DB" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg><div class="n" id="clockN">${R.left}</div></div>
    </div>
    <div class="board ${R.reveal?'revealed':''}">
      ${w?`
      <div class="tiles ${w.t.length>10?'small':''}">${w.t.map((c,i)=>`<div class="tile" style="animation-delay:${i*40}ms">${esc(c)}</div>`).join('')}</div>
      ${R.reveal?`<div class="answer">เฉลย → <b>${esc(w.a)}</b></div>`:''}
      ${w.h?`<div class="hint"><span class="label">คำใบ้</span>${esc(w.h)}</div>`:`<div class="hint none"><span class="label">คำใบ้</span>คำทั่วไป ไม่มีคำใบ้</div>`}`:''}
      <div class="flash" id="flash"></div>
      ${R.phase==='count'?`<div class="overlay" id="ov"></div>`:''}
      ${R.phase==='play'&&!R.running?`<div class="overlay"><h2>หยุดเวลาชั่วคราว</h2><button type="button" class="btn-cyan big" id="resumeBtn">เล่นต่อ ▶</button></div>`:''}
    </div>
    <div class="controls">
      <button type="button" class="btn-go big" id="okBtn">✓ ตอบถูก</button>
      <button type="button" class="big" id="skipBtn">ข้าม ↻</button>
      <button type="button" class="big btn-ghost" id="ansBtn">${R.reveal?'ซ่อนเฉลย':'เปิดเฉลย'}</button>
      <button type="button" class="big btn-ghost" id="pauseBtn">${R.running?'❚❚ หยุด':'▶ เล่นต่อ'}</button>
      <button type="button" class="big btn-stop" id="endBtn">จบรอบ</button>
    </div>
    <div class="kbd"><kbd>Enter</kbd> ถูก · <kbd>S</kbd> ข้าม · <kbd>A</kbd> เฉลย · <kbd>Space</kbd> หยุด/เล่นต่อ</div>
  </div>`;
  if(R.phase==='count') paintOverlay(3);
  paintClock(); fitBox($('.board'));
  const busy = R.phase!=='play';
  ['okBtn','skipBtn','ansBtn','pauseBtn'].forEach(id=>$('#'+id).disabled=busy);
  $('#okBtn').onclick=mark;
  $('#skipBtn').onclick=skip;
  $('#ansBtn').onclick=()=>{R.reveal=!R.reveal;renderPlay();};
  $('#pauseBtn').onclick=togglePause;
  $('#endBtn').onclick=finish;
  if($('#resumeBtn')) $('#resumeBtn').onclick=togglePause;
}
function paintClock(){
  const n=$('#clockN'),a=$('#arc'),c=$('#clock'); if(!n) return;
  n.textContent=Math.max(0,R.left);
  a.style.strokeDashoffset = 276.46*(1-Math.max(0,R.left)/TIME);
  a.style.stroke = R.left<=10?'#FF0000':'#00A5DB';
  c.classList.toggle('warn',R.left<=10&&R.running);
}
function togglePause(){ if(R.phase!=='play') return; R.running?pause():resume(); renderPlay(); }
function flash(txt,col){ const f=$('#flash'); if(!f) return; f.textContent=txt; f.style.color=col; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); }
function mark(){
  if(R.phase!=='play'||!R.running) return;
  const w=cur(); w.st='ok'; R.queue.shift(); R.reveal=false; sfx.ok();
  if(!R.queue.length){ finish(); return; }
  renderPlay(); flash('ถูกต้อง!','#00B050');
}
function skip(){
  if(R.phase!=='play'||!R.running) return;
  if(R.queue.length<2){ sfx.skip(); return; }
  const w=cur(); w.st='skip'; R.queue.push(R.queue.shift()); R.reveal=false; sfx.skip();
  renderPlay(); flash('ข้าม','#E8A400');
}
function finish(){
  if(!R||R.phase==='done') return;
  pause(); R.phase='done'; sfx.end();
  const score=R.words.filter(w=>w.st==='ok').length;
  const used=TIME-Math.max(0,R.left);
  const t=S.teams[R.team]; t.score=score; t.time=used; t.set=R.set;
  if(!S.used.includes(R.set)) S.used.push(R.set);
  // next unplayed team becomes selected
  const nxt=S.teams.findIndex(x=>x.score===null); if(nxt>=0) S.selTeam=nxt; S.selSet=null;
  save(); renderResult(score,used);
}
function renderResult(score,used){
  const t=S.teams[R.team];
  main.innerHTML=`
  <div class="screen">
    <div class="playbar">
      <div class="who">${esc(t.name)}<small>ชุดที่ ${R.set} · ใช้เวลา ${used} วินาที</small></div>
      <span class="spacer"></span>
      <div style="text-align:right"><div class="label">คะแนนรอบนี้</div><div class="bigscore">${score}<span style="font-size:.45em;color:var(--muted)"> / 5</span></div></div>
    </div>
    <div class="label">เฉลยทั้งชุด</div>
    <div class="res">${R.words.map(w=>`
      <div class="rcard ${w.st==='ok'?'ok':''}">
        <div class="st">${w.st==='ok'?'✓ ตอบถูก':'✗ ยังไม่ได้'}</div>
        <div class="w">${esc(w.a)}</div>
        <div class="h">${esc(w.h||'คำทั่วไป')}</div>
      </div>`).join('')}</div>
    <div class="spacer"></div>
    <div class="controls"><button type="button" class="btn-cyan big" id="back">ไปตารางคะแนน →</button></div>
  </div>`;
  $('#back').onclick=goHome;
}
function goHome(){
  if(R && R.phase!=='done'){ // abandon mid-round without scoring
    pause(); R=null;
  }
  R=null; renderHome();
}
$('#btnHome').onclick=goHome;

document.addEventListener('keydown',e=>{
  if(!R||R.phase!=='play'||e.target.tagName==='INPUT') return;
  if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();mark();}
  else if(e.key==='s'||e.key==='S'||e.key==='ห'){e.preventDefault();skip();}
  else if(e.key==='a'||e.key==='A'||e.key==='ฟ'){e.preventDefault();R.reveal=!R.reveal;renderPlay();}
  else if(e.key===' '){e.preventDefault();togglePause();}
});

window.addEventListener('resize',()=>fitBox($('.board')));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fitBox($('.board')));
renderHome();
</script>

</body></html>
