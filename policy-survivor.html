<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Policy Survivor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Kanit:wght@400;500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen game for a projector. Theme: night temple fair (งานวัด) — dark night sky, gold booth-sign accents, red buttons, bunting and fairy lights on top. */
:root{
  --bg:#1A0F33; --ink:#FFF3D6; --muted:#C4B5E6; --line:#4B3A7D; --soft:#251748;
  --cyan:#FFD23F; --go:#17A653; --stop:#FF3B5C; --gold:#FFB020; --hl:#3B2468; --red:#E0262F;
  --deco:"Chonburi","Kanit","Leelawadee UI",serif;
  --display:"Kanit","Leelawadee UI","Tahoma",sans-serif;
  --body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
 
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;display:flex;flex-direction:column}
.app{flex:1;min-height:0;width:100%;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.title{font-family:var(--body);font-weight:700;font-size:clamp(17px,1.7vw,22px);margin:0}
.title b{font-size:1.12em}
.spacer{flex:1}
button{font-family:var(--body);cursor:pointer;border-radius:8px;font-size:16px;font-weight:600;padding:9px 16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);transition:background .15s,transform .08s}
button:hover{background:var(--soft)}button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.primary:hover{background:#26318A}
.big{font-size:clamp(17px,1.8vw,22px);padding:12px 24px}
.label{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
kbd{font-family:var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--soft)}
.surv{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px}
.surv .n{font-family:var(--display);font-weight:700;font-size:26px;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums;background:transparent;border:0;width:3.2ch}
.surv button{padding:2px 12px;font-size:20px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qno{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.4vw,32px)}
.qno small{font-size:.6em;color:var(--muted);font-weight:400}
.tag{font-size:14px;padding:3px 12px;border-radius:999px;background:var(--hl);color:var(--ink);font-weight:600}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.2vw,44px);font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:right}
.clock.warn{color:var(--stop)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);transition:width 1s linear}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:calc(var(--k,1) * clamp(16px,3.4vh,40px));overflow:auto;padding-block:12px}
.question{font-family:var(--body);font-weight:700;font-size:calc(var(--k,1) * clamp(28px,3.8vw,58px));line-height:1.45;text-wrap:balance;text-align:left;margin:0;max-width:42ch;width:100%}
.answers{display:grid;grid-template-columns:1fr 1fr;width:min(100%,860px);border:1.5px solid var(--ink)}
.answers div{display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(var(--k,1) * clamp(14px,2.4vh,26px)) 12px;font-family:var(--body);font-weight:700;font-size:calc(var(--k,1) * clamp(28px,3.6vw,52px));color:#fff}
.answers .yes{background:var(--go)}
.answers .no{background:var(--stop);border-left:1.5px solid var(--ink)}
.reveal{width:100%;max-width:46ch;display:flex;flex-direction:column;gap:clamp(12px,2vh,22px);text-align:center;align-items:center}
.reveal .a{font-family:var(--body);font-weight:700;font-size:calc(var(--k,1) * clamp(30px,4vw,60px));line-height:1.3}
.reveal .a .yes{color:var(--go)}.reveal .a .no{color:var(--stop)}
.reveal .why{font-size:calc(var(--k,1) * clamp(24px,3vw,44px));line-height:1.5;font-weight:500;text-wrap:balance}
.reveal .ref{font-size:calc(var(--k,1) * clamp(15px,1.4vw,19px));color:var(--muted)}
.reveal .ref b{color:var(--ink)}
.reveal .q{font-size:calc(var(--k,1) * clamp(14px,1.3vw,18px));color:var(--muted);max-width:70ch;line-height:1.5}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{color:var(--muted);font-size:12px}
/* intro */
.intro{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:center}
.intro h2{font-family:var(--body);font-weight:700;font-size:clamp(42px,6vw,88px);line-height:1.1;margin:0}
.intro h2 span{color:var(--cyan);display:block}
.intro p{font-size:clamp(17px,1.6vw,21px);line-height:1.65;max-width:50ch}
.chip{display:inline-block;padding:0 10px;color:#fff;font-weight:700;border-radius:4px}
.chip.yes{background:var(--go)}.chip.no{background:var(--stop)}
.how{border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:14px;background:var(--soft)}
.how ol{margin:0;padding-left:20px;line-height:1.8}
.how .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.how input{font-family:var(--display);font-size:20px;width:6ch;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:900px){.intro{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Theme: งานวัด — night temple fair: bunting flags, fairy-light bulbs, ferris wheel glow, booth-sign gold and red ===== */
body{background:radial-gradient(ellipse 70% 45% at 50% 118%,rgba(255,130,40,.30),transparent 70%),radial-gradient(ellipse 40% 40% at 0% 105%,rgba(255,59,138,.20),transparent 70%),linear-gradient(180deg,#110824 0%,var(--bg) 55%);background-color:var(--bg)}
body::after{content:"";position:fixed;right:-30px;bottom:-24px;width:min(42vw,480px);aspect-ratio:400/420;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 420' fill='none' stroke='%23FFD23F' stroke-width='4' stroke-linecap='round'><circle cx='200' cy='180' r='150'/><circle cx='200' cy='180' r='118'/><circle cx='200' cy='180' r='18' fill='%23FFD23F'/><g id='s'><line x1='200' y1='30' x2='200' y2='330'/><line x1='50' y1='180' x2='350' y2='180'/><line x1='94' y1='74' x2='306' y2='286'/><line x1='306' y1='74' x2='94' y2='286'/><line x1='125' y1='50' x2='275' y2='310'/><line x1='275' y1='50' x2='125' y2='310'/><line x1='70' y1='105' x2='330' y2='255'/><line x1='330' y1='105' x2='70' y2='255'/></g><g fill='%23FFD23F'><rect x='188' y='22' width='24' height='20' rx='5'/><rect x='188' y='320' width='24' height='20' rx='5'/><rect x='38' y='171' width='24' height='20' rx='5'/><rect x='338' y='171' width='24' height='20' rx='5'/><rect x='82' y='66' width='24' height='20' rx='5'/><rect x='294' y='66' width='24' height='20' rx='5'/><rect x='82' y='277' width='24' height='20' rx='5'/><rect x='294' y='277' width='24' height='20' rx='5'/></g><line x1='200' y1='180' x2='110' y2='410'/><line x1='200' y1='180' x2='290' y2='410'/><line x1='80' y1='410' x2='320' y2='410'/></svg>") center/contain no-repeat;opacity:.09;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
.fair-top{flex:none;position:relative;z-index:2;height:44px;pointer-events:none}
.fair-top .bunting{position:absolute;inset:0 0 auto 0;height:30px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='30' viewBox='0 0 140 30'><path d='M0 4 Q70 9 140 4' stroke='%23FFE9A8' stroke-width='1.5' fill='none'/><path d='M4 4.4 L24 5.6 L14 25Z' fill='%23E0262F'/><path d='M32 6 L52 6.8 L42 26Z' fill='%23FFB020'/><path d='M60 6.7 L80 6.7 L70 26.5Z' fill='%2317A653'/><path d='M88 6.8 L108 6 L98 26Z' fill='%23FF3B8A'/><path d='M116 5.6 L136 4.4 L126 25Z' fill='%232F6FE0'/></svg>") 0 0/140px 30px repeat-x}
.fair-top .bulbs{position:absolute;left:0;right:0;top:30px;height:14px}
.fair-top .bulbs::before,.fair-top .bulbs::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#FFF4B8 0 3px,rgba(255,210,63,.55) 4px,transparent 7px) 8px 50%/36px 14px repeat-x;animation:twinkle 1.4s ease-in-out infinite alternate}
.fair-top .bulbs::after{background-image:radial-gradient(circle,#FFD0E6 0 3px,rgba(255,59,138,.55) 4px,transparent 7px);background-position:26px 50%;animation-delay:.7s}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
.title,.intro h2,.count,.bigscore,.winner,.wheel-card h2{font-family:var(--deco)}
.title{color:var(--cyan);font-weight:400;letter-spacing:.3px;text-shadow:0 0 18px rgba(255,210,63,.35)}
.title b{color:var(--ink)}
.intro h2{font-weight:400;text-shadow:0 0 24px rgba(255,210,63,.25)}
.btn-cyan,.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 2px rgba(255,210,63,.35) inset}
.btn-cyan:hover,.primary:hover{background:#F23B44}
.btn-go:hover{background:#1DBA5E}
.btn-stop:hover{background:#FF5470}
.set.sel,.rounds button.on,.seg button.on{background:var(--cyan);border-color:var(--cyan);color:#2A1500}
.rounds button.on small{color:#5A3A00}
.team.sel{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(255,210,63,.28)}
.dot.cur{box-shadow:0 0 0 3px rgba(255,210,63,.3)}
.side,.how{background:rgba(37,23,72,.85)}
.team{background:rgba(26,15,51,.85)}
.overlay{background:rgba(22,12,44,.95)}
.flash.ans{background:rgba(22,12,44,.94)}
.tile{border-bottom-color:rgba(255,210,63,.5);text-shadow:0 0 22px rgba(255,210,63,.22)}
.answer b{color:var(--cyan)}
.tag{background:var(--cyan);color:#2A1500}
.winner{font-weight:400;border:2px solid var(--cyan);box-shadow:0 0 30px rgba(255,210,63,.25)}
.winner small{font-family:var(--body)}
.wheel-modal{background:rgba(8,4,20,.75)}
.wheel-card{background:var(--soft);border:2px solid var(--cyan);box-shadow:0 0 0 6px rgba(255,210,63,.12),0 20px 60px rgba(0,0,0,.5)}
.wheel-card h2{font-weight:400;color:var(--cyan)}
.wheel-hub{background:var(--red);border-color:var(--cyan);color:#fff}
.answers{border-color:var(--cyan)}
.answers .no{border-left-color:var(--cyan)}
.reveal .ref b{color:var(--cyan)}
@media (prefers-reduced-motion:reduce){.fair-top .bulbs::before,.fair-top .bulbs::after{animation:none;opacity:1}}
</style>

</head><body>
<div class="fair-top" aria-hidden="true"><div class="bunting"></div><div class="bulbs"></div></div>
<div class="app">
  <header>
    <h1 class="title">Activity 2: Policy Survivor <b>รู้จริง ต้องรอด!</b></h1>
    <span class="spacer"></span>
    <div class="surv" title="จำนวนผู้เล่นที่ยังรอด">
      <span class="label">ผู้รอด</span>
      <button type="button" id="sMinus" aria-label="ลดผู้รอด">−</button>
      <input class="n" id="sN" inputmode="numeric" aria-label="จำนวนผู้รอด">
      <button type="button" id="sPlus" aria-label="เพิ่มผู้รอด">+</button>
    </div>
    <button type="button" id="btnSound">🔊 เสียงเปิด</button>
  </header>
  <main id="main"></main>
</div>

const KEY='policy-survivor-v2';
let S = load() || {i:-1,survivors:50,secs:15,seen:[],sound:true};
function load(){ try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
const $=s=>document.querySelector(s), main=$('#main');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fitBox(box){ if(!box) return; let k=1; box.style.setProperty('--k',k); let n=0; while(box.scrollHeight>box.clientHeight+1 && k>0.34 && n++<40){ k-=0.03; box.style.setProperty('--k',k.toFixed(2)); } }
const pg=n=>{const e=$('#pg'); if(e) e.textContent=n;};

let AC=null;
function beep(f=880,d=.12,type='sine',v=.25){ if(!S.sound) return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){} }
function paintSound(){ $('#btnSound').textContent=S.sound?'🔊 เสียงเปิด':'🔇 เสียงปิด'; }
$('#btnSound').onclick=()=>{S.sound=!S.sound;save();paintSound();};
paintSound();

const sN=$('#sN');
function paintSurv(){ sN.value=S.survivors; }
$('#sMinus').onclick=()=>{S.survivors=Math.max(0,S.survivors-1);save();paintSurv();};
$('#sPlus').onclick=()=>{S.survivors++;save();paintSurv();};
sN.oninput=()=>{const v=parseInt(sN.value,10); if(!isNaN(v)&&v>=0){S.survivors=v;save();}};
paintSurv();

function renderIntro(){
  stopTimer(); pg('');
  main.innerHTML=`
  <div class="intro">
    <div>
      <h2>Policy Survivor<span>รู้จริง ต้องรอด!</span></h2>
      <p>ทุกคนยืนขึ้น อ่านคำถามบนจอแล้วเลือกฝั่ง <span class="chip yes">ทำได้ / จริง</span> หรือ <span class="chip no">ทำไม่ได้ / ไม่จริง</span> ตามตัวเลือกของแต่ละข้อ ภายในเวลาที่กำหนด ใครตอบผิดนั่งลง คนที่ยังยืนอยู่จนข้อสุดท้ายคือผู้รอดชีวิต</p>
    </div>
    <div class="how">
      <ol>
        <li>ข้อ 1–2 เป็นข้อตัวอย่างสำหรับซ้อม ยังไม่คัดออก</li>
        <li>กด <kbd>Space</kbd> เริ่มจับเวลา หมดเวลาแล้วกด <kbd>R</kbd> เฉลย</li>
        <li>ปรับจำนวนผู้รอดที่มุมขวาบนหลังเฉลยแต่ละข้อ</li>
        <li><kbd>→</kbd> ข้อต่อไป · <kbd>←</kbd> ย้อนกลับ</li>
      </ol>
      <div class="row"><span class="label">ผู้เล่นเริ่มต้น</span><input id="startN" inputmode="numeric" value="${S.survivors}"></div>
      <div class="row"><span class="label">เวลาต่อข้อ</span>
        <div class="seg">${[10,15,20,30].map(s=>`<button type="button" data-s="${s}" class="${S.secs===s?'on':''}">${s} วิ</button>`).join('')}</div></div>
      <div class="row">
        <button type="button" class="primary big" id="go">${S.i>=0?'เล่นต่อข้อ '+QS[S.i].n:'เริ่มเกม ▶'}</button>
        ${S.i>=0?`<button type="button" id="restart">เริ่มใหม่ตั้งแต่ข้อ 1</button>`:''}
      </div>
    </div>
  </div>`;
  $('#startN').oninput=e=>{const v=parseInt(e.target.value,10); if(!isNaN(v)&&v>=0){S.survivors=v;save();paintSurv();}};
  main.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.secs=+b.dataset.s;save();renderIntro();});
  $('#go').onclick=()=>go(Math.max(0,S.i));
  if($('#restart')) $('#restart').onclick=()=>{S.seen=[];go(0);};
}

let left=0,tm=null,revealed=false;
function stopTimer(){clearInterval(tm);tm=null;}
function go(i){ stopTimer(); S.i=Math.max(0,Math.min(QS.length-1,i)); save(); revealed=false; left=S.secs; renderQ(); }
function startTimer(){
  if(tm||revealed) return; if(left<=0) left=S.secs;
  beep(880,.2);
  tm=setInterval(()=>{ left--; if(left<=5&&left>0) beep(1200,.05,'square',.12); if(left<=0){stopTimer();beep(220,.6,'sawtooth',.3);} paintClock(); },1000);
  paintClock();
}
function paintClock(){
  const c=$('#clock'),b=$('#barI'); if(!c) return;
  c.textContent=left; c.classList.toggle('warn',left<=5);
  b.style.width=(left/S.secs*100)+'%'; b.style.background=left<=5?'var(--stop)':'var(--cyan)';
  const tb=$('#timerBtn'); if(tb) tb.textContent= tm?'❚❚ หยุดเวลา':(left===S.secs?'▶ เริ่มจับเวลา':'▶ เริ่มนับใหม่');
}
function reveal(){
  if(revealed) return; stopTimer(); revealed=true;
  if(!S.seen.includes(S.i)) S.seen.push(S.i); save();
  beep(660,.12); setTimeout(()=>beep(990,.25),110);
  renderQ();
}
function renderQ(){
  const q=QS[S.i], exNo=QS.slice(0,S.i+1).filter(x=>x.ex).length;
  pg(q.n);
  main.innerHTML=`
    <div class="qhead">
      <div class="qno">ข้อ ${q.n}<small> / ${QS.length}</small></div>
      ${q.ex?`<span class="tag">ตัวอย่าง ${exNo} · ซ้อม ยังไม่คัดออก</span>`:''}
      <span class="spacer"></span>
      <div class="clock" id="clock">${left}</div>
    </div>
    <div class="bar"><i id="barI" style="width:100%"></i></div>
    <div class="stage">
    ${revealed?`
      <div class="reveal">
        <div class="a">เฉลย: <span class="${q.ok?'yes':'no'}">${q.ok?'✅':'❌'} ${esc(q.a)}</span></div>
        <div class="why">${esc(q.why)}</div>
        <div class="ref">อ้างอิง: <b>${esc(q.ref)}</b></div>
        <div class="q">คำถาม: ${esc(q.q)}</div>
      </div>`:`
      <p class="question">${esc(q.q)}</p>
      <div class="answers"><div class="yes">${esc(q.y)}</div><div class="no">${esc(q.no)}</div></div>`}
    </div>
    <div class="controls">
      <button type="button" id="prev" ${S.i===0?'disabled':''}>← ก่อนหน้า</button>
      <button type="button" class="big" id="timerBtn" ${revealed?'disabled':''}>▶ เริ่มจับเวลา</button>
      <button type="button" class="big primary" id="revBtn" ${revealed?'disabled':''}>เฉลย</button>
      <button type="button" class="big" id="next" ${S.i===QS.length-1?'disabled':''}>ข้อต่อไป →</button>
      <span class="spacer"></span>
      <span class="kbd"><kbd>Space</kbd> จับเวลา · <kbd>R</kbd> เฉลย · <kbd>→</kbd> ต่อไป · <kbd>←</kbd> ย้อน</span>
      <button type="button" id="menu">เมนู</button>
    </div>`;
  paintClock(); fitBox($('.stage'));
  $('#prev').onclick=()=>go(S.i-1);
  $('#next').onclick=()=>go(S.i+1);
  $('#timerBtn').onclick=()=>tm?(stopTimer(),paintClock()):startTimer();
  $('#revBtn').onclick=reveal;
  $('#menu').onclick=renderIntro;
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||!$('#revBtn')) return;
  if(e.key===' '){e.preventDefault(); if(!revealed) (tm?(stopTimer(),paintClock()):startTimer());}
  else if(e.key==='r'||e.key==='R'||e.key==='พ'){e.preventDefault();reveal();}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.i<QS.length-1) go(S.i+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.i>0) go(S.i-1);}
});
window.addEventListener('resize',()=>fitBox($('.stage')));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fitBox($('.stage')));
renderIntro();
</script>

</body></html>
