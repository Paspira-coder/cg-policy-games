<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CG Policy Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Kanit:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
:root{--bg:#1A0F33;--ink:#FFF3D6;--muted:#C4B5E6;--line:#4B3A7D;--soft:#251748;--gold:#FFD23F;--red:#E0262F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:radial-gradient(ellipse 70% 45% at 50% 118%,rgba(255,130,40,.30),transparent 70%),radial-gradient(ellipse 40% 40% at 0% 105%,rgba(255,59,138,.20),transparent 70%),linear-gradient(180deg,#110824 0%,var(--bg) 55%);background-color:var(--bg);display:flex;flex-direction:column}
body::after{content:"";position:fixed;right:-30px;bottom:-24px;width:min(42vw,480px);aspect-ratio:400/420;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 420' fill='none' stroke='%23FFD23F' stroke-width='4' stroke-linecap='round'><circle cx='200' cy='180' r='150'/><circle cx='200' cy='180' r='118'/><circle cx='200' cy='180' r='18' fill='%23FFD23F'/><g id='s'><line x1='200' y1='30' x2='200' y2='330'/><line x1='50' y1='180' x2='350' y2='180'/><line x1='94' y1='74' x2='306' y2='286'/><line x1='306' y1='74' x2='94' y2='286'/><line x1='125' y1='50' x2='275' y2='310'/><line x1='275' y1='50' x2='125' y2='310'/><line x1='70' y1='105' x2='330' y2='255'/><line x1='330' y1='105' x2='70' y2='255'/></g><g fill='%23FFD23F'><rect x='188' y='22' width='24' height='20' rx='5'/><rect x='188' y='320' width='24' height='20' rx='5'/><rect x='38' y='171' width='24' height='20' rx='5'/><rect x='338' y='171' width='24' height='20' rx='5'/><rect x='82' y='66' width='24' height='20' rx='5'/><rect x='294' y='66' width='24' height='20' rx='5'/><rect x='82' y='277' width='24' height='20' rx='5'/><rect x='294' y='277' width='24' height='20' rx='5'/></g><line x1='200' y1='180' x2='110' y2='410'/><line x1='200' y1='180' x2='290' y2='410'/><line x1='80' y1='410' x2='320' y2='410'/></svg>") center/contain no-repeat;opacity:.09;pointer-events:none}
.fair-top{height:44px;position:relative;flex:none}
.bunting{position:absolute;inset:0 0 auto 0;height:30px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='30' viewBox='0 0 140 30'><path d='M0 4 Q70 9 140 4' stroke='%23FFE9A8' stroke-width='1.5' fill='none'/><path d='M4 4.4 L24 5.6 L14 25Z' fill='%23E0262F'/><path d='M32 6 L52 6.8 L42 26Z' fill='%23FFB020'/><path d='M60 6.7 L80 6.7 L70 26.5Z' fill='%2317A653'/><path d='M88 6.8 L108 6 L98 26Z' fill='%23FF3B8A'/><path d='M116 5.6 L136 4.4 L126 25Z' fill='%232F6FE0'/></svg>") 0 0/140px 30px repeat-x}
.bulbs{position:absolute;left:0;right:0;top:30px;height:14px}
.bulbs::before,.bulbs::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#FFF4B8 0 3px,rgba(255,210,63,.55) 4px,transparent 7px) 8px 50%/36px 14px repeat-x;animation:tw 1.4s ease-in-out infinite alternate}
.bulbs::after{background-image:radial-gradient(circle,#FFD0E6 0 3px,rgba(255,59,138,.55) 4px,transparent 7px);background-position:26px 50%;animation-delay:.7s}
@keyframes tw{from{opacity:.35}to{opacity:1}}
main{flex:1;width:min(100%,940px);margin:0 auto;display:grid;align-content:center;gap:24px;padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));position:relative;z-index:1}
.eyebrow{color:var(--gold);font-weight:600;letter-spacing:1.5px;font-size:14px}
h1{font-family:Chonburi,Kanit,serif;font-weight:400;font-size:clamp(36px,6vw,68px);margin:0;line-height:1.15;text-shadow:0 0 28px rgba(255,210,63,.3)}
h1 span{color:var(--gold)}
p{color:var(--muted);margin:0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:grid;gap:8px;text-decoration:none;color:var(--ink);background:rgba(37,23,72,.85);border:2px solid var(--line);border-radius:16px;padding:24px;transition:border-color .15s,transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 0 30px rgba(255,210,63,.2);outline:none}
.n{font-size:13px;letter-spacing:1.2px;color:var(--gold);font-weight:600}
.t{font-family:Chonburi,Kanit,serif;font-size:28px;line-height:1.3}
.d{color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){.bulbs::before,.bulbs::after{animation:none;opacity:1}}
</style></head>
<body><div class="fair-top" aria-hidden="true"><div class="bunting"></div><div class="bulbs"></div></div>

<a class="card" href="policy-survivor.html"><span class="n">ACTIVITY 2</span><span class="t">Policy Survivor รู้จริง ต้องรอด!</span><span class="d">30 คำถาม แข่งเดี่ยวแบบคัดออก พร้อมเฉลยและอ้างอิงนโยบาย</span></a>
</div>
</main></body></html>
